name: Generate README

on:
  push:
    branches: [main]
    paths: ['readme.source.md']
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject contribution count
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/inject-contributions.sh

      - name: Generate README
        uses: collectioneur/readme-aura@v1.0.20
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
